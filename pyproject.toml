[tool.poetry]
name = "wellness-log"
version = "0.1.0"
description = "A lightweight single-user daily wellness habit tracker"
authors = ["wellness-log contributors"]
readme = "README.md"
packages = [{ include = "wellness_log" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
jinja2 = "^3.1.4"
sqlalchemy = "^2.0.36"
python-multipart = "^0.0.17"
tzdata = "^2024.2"
boto3 = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
