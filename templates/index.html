<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wellness-log</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>Wellness Log</h1>
      <p class="checkin-date"><strong>DAILY CHECK-IN</strong><br><span>{{ display_date }}</span></p>
      {% if saved %}<p class="confirmation" role="status">Saved successfully.</p>{% endif %}
    </header>

    <form method="post" action="/save">
      <div class="bulk-actions">
        <button id="set-all-toggle" class="bulk-button" type="button">{% if all_yes %}Set all to No{% else %}Set all to Yes{% endif %}</button>
      </div>
      {% for group, habits in groups.items() %}
        <section class="habit-group">
          <h2>{{ group }}</h2>
          {% for habit in habits %}
            <fieldset class="habit-row">
              <legend>{{ habit.name }}</legend>
              <div class="choices">
                <input type="radio" id="{{ habit.key }}-yes" name="{{ habit.key }}" value="yes" {% if answers.get(habit.key) is sameas true %}checked{% endif %}>
                <label for="{{ habit.key }}-yes">Yes</label>
                <input type="radio" id="{{ habit.key }}-no" name="{{ habit.key }}" value="no" {% if answers.get(habit.key) is not sameas true %}checked{% endif %}>
                <label for="{{ habit.key }}-no">No</label>
              </div>
            </fieldset>
          {% endfor %}
        </section>
      {% endfor %}
      <button class="save-button" type="submit">Save daily log</button>
    </form>
  </main>
  <script>
    const bulkToggle = document.querySelector('#set-all-toggle');
    const yesChoices = [...document.querySelectorAll('input[type="radio"][value="yes"]')];
    const allChoices = [...document.querySelectorAll('input[type="radio"]')];

    const allAreYes = () => yesChoices.every((input) => input.checked);
    const updateBulkToggle = () => {
      bulkToggle.textContent = allAreYes() ? 'Set all to No' : 'Set all to Yes';
    };

    bulkToggle.addEventListener('click', () => {
      const value = allAreYes() ? 'no' : 'yes';
      document.querySelectorAll(`input[type="radio"][value="${value}"]`).forEach((input) => {
        input.checked = true;
      });
      updateBulkToggle();
    });
    allChoices.forEach((input) => input.addEventListener('change', updateBulkToggle));
  </script>
</body>
</html>
