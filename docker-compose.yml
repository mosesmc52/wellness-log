services:
  web:
    build: .
    image: wellness-log:local
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/usr/local/bin/web-entrypoint"]
    command: ["uvicorn", "wellness_log.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data

  scheduler:
    image: wellness-log:local
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    entrypoint: ["/usr/local/bin/scheduler-entrypoint"]
