services:
  web:
    build: .
    image: wellness-log:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wellness_data:/app/data

  scheduler:
    image: wellness-log:local
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wellness_data:/app/data
    entrypoint: ["/usr/local/bin/scheduler-entrypoint"]

volumes:
  wellness_data:
